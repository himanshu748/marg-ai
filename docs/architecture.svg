<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">MargAI road damage survey architecture</title>
  <desc id="desc">Dashcam and GPS data flow through S3, SQS, a Fargate Graviton worker, DynamoDB and S3 outputs, a Bedrock agent loop, and a FastAPI Leaflet dashboard behind an application load balancer before human approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5f2"/>
    </linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8edff"/>
      <stop offset="1" stop-color="#b8d8f1"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e4bd"/>
      <stop offset="1" stop-color="#f1c878"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2d526d"/>
    </marker>
    <marker id="green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#23795b"/>
    </marker>
    <style>
      .title { font: 700 32px sans-serif; fill: #17324d; }
      .subtitle { font: 400 16px sans-serif; fill: #496274; }
      .box-title { font: 700 21px sans-serif; fill: #17324d; }
      .body { font: 400 15px sans-serif; fill: #26485c; }
      .small { font: 400 13px sans-serif; fill: #496274; }
      .label { font: 700 13px sans-serif; fill: #2d526d; }
      .arrow { stroke: #2d526d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .green-arrow { stroke: #23795b; stroke-width: 3; fill: none; marker-end: url(#green-arrow); }
      .dashed { stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="80" y="66" class="title">MargAI · approval-gated road-damage survey</text>
  <text x="80" y="96" class="subtitle">OpenCV 5 vision, AWS event processing, and an auditable agent loop</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="220" height="150" rx="18" fill="#ffffff" stroke="#7ba7c6" stroke-width="2"/>
    <text x="100" y="211" class="box-title">Dashcam / GPS</text>
    <text x="100" y="244" class="body">Video upload</text>
    <text x="100" y="269" class="body">Optional GPX track</text>
    <text x="100" y="294" class="small">Operator or field vehicle</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="170" width="190" height="150" rx="18" fill="#ffffff" stroke="#7ba7c6" stroke-width="2"/>
    <text x="418" y="211" class="box-title">Amazon S3</text>
    <text x="395" y="244" class="body">uploads/&lt;survey&gt;</text>
    <text x="395" y="269" class="body">survey outputs</text>
    <text x="395" y="294" class="small">Evidence, crops, traces</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="170" width="190" height="150" rx="18" fill="#ffffff" stroke="#7ba7c6" stroke-width="2"/>
    <text x="679" y="211" class="box-title">Amazon SQS</text>
    <text x="660" y="244" class="body">margai-jobs</text>
    <text x="660" y="269" class="body">DLQ on failure</text>
    <text x="660" y="294" class="small">Queued survey IDs</text>
  </g>

  <path d="M290 245 H365" class="arrow"/>
  <text x="306" y="230" class="label">PUT</text>
  <path d="M555 245 H630" class="arrow"/>
  <text x="576" y="230" class="label">event</text>

  <g filter="url(#shadow)">
    <rect x="880" y="125" width="400" height="315" rx="20" fill="url(#worker)" stroke="#4e88b0" stroke-width="2"/>
    <text x="920" y="169" class="box-title">Fargate Graviton worker</text>
    <text x="920" y="195" class="small">ARM64 · 1 vCPU · 2 GB · least-privilege task role</text>
    <rect x="915" y="220" width="330" height="42" rx="10" fill="#ffffff" opacity=".82"/>
    <text x="935" y="247" class="body">1. ingest + quality / blur filtering</text>
    <rect x="915" y="271" width="330" height="42" rx="10" fill="#ffffff" opacity=".82"/>
    <text x="935" y="298" class="body">2. ORB keyframes + homography</text>
    <rect x="915" y="322" width="330" height="42" rx="10" fill="#ffffff" opacity=".82"/>
    <text x="935" y="349" class="body">3. DNN YOLOv8 + NMS detections</text>
    <rect x="915" y="373" width="330" height="42" rx="10" fill="#ffffff" opacity=".82"/>
    <text x="935" y="400" class="body">4. Farneback tracking + severity / GPS</text>
  </g>
  <path d="M820 245 H880" class="arrow"/>
  <text x="833" y="230" class="label">poll</text>

  <g filter="url(#shadow)">
    <rect x="1350" y="145" width="190" height="120" rx="18" fill="#ffffff" stroke="#7ba7c6" stroke-width="2"/>
    <text x="1384" y="185" class="box-title">DynamoDB</text>
    <text x="1373" y="216" class="body">survey status</text>
    <text x="1373" y="240" class="body">work orders</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1350" y="300" width="190" height="120" rx="18" fill="#ffffff" stroke="#7ba7c6" stroke-width="2"/>
    <text x="1410" y="340" class="box-title">S3</text>
    <text x="1373" y="371" class="body">result.json</text>
    <text x="1373" y="395" class="body">media + trace</text>
  </g>
  <path d="M1280 230 H1350" class="arrow"/>
  <path d="M1280 350 H1350" class="arrow"/>
  <text x="1291" y="215" class="label">status</text>
  <text x="1291" y="335" class="label">outputs</text>

  <g filter="url(#shadow)">
    <rect x="390" y="500" width="320" height="205" rx="20" fill="url(#agent)" stroke="#be8732" stroke-width="2"/>
    <text x="430" y="545" class="box-title">Bedrock agent loop</text>
    <text x="430" y="577" class="body">Inspect uncertain evidence</text>
    <text x="430" y="603" class="body">Compare frames / request resurvey</text>
    <text x="430" y="629" class="body">Draft work orders and approvals</text>
    <text x="430" y="655" class="body">JSONL trace + auditor</text>
    <text x="430" y="684" class="small">MockLLM enables deterministic local demos</text>
  </g>
  <path d="M1350 390 C1170 480 940 525 710 560" class="green-arrow"/>
  <text x="1050" y="470" class="label">survey + evidence</text>
  <path d="M710 615 C940 560 1170 520 1350 365" class="green-arrow dashed"/>
  <text x="1010" y="590" class="label">agent decisions</text>

  <g filter="url(#shadow)">
    <rect x="810" y="520" width="310" height="185" rx="20" fill="#ffffff" stroke="#7ba7c6" stroke-width="2"/>
    <text x="850" y="562" class="box-title">FastAPI + Leaflet</text>
    <text x="850" y="594" class="body">ALB :80 / dashboard</text>
    <text x="850" y="620" class="body">Map, evidence, trace, uploads</text>
    <text x="850" y="646" class="body">Approve / reject work orders</text>
    <text x="850" y="680" class="small">Local mode uses JSON; AWS mode uses S3</text>
  </g>
  <path d="M1350 300 C1270 430 1190 515 1120 560" class="arrow"/>
  <text x="1230" y="425" class="label">read</text>
  <path d="M710 605 H810" class="green-arrow"/>
  <text x="735" y="587" class="label">results</text>

  <g filter="url(#shadow)">
    <rect x="1210" y="770" width="280" height="115" rx="18" fill="#e5f4e9" stroke="#4d9a68" stroke-width="2"/>
    <text x="1260" y="811" class="box-title">Human approval</text>
    <text x="1245" y="843" class="body">Municipal work-order decision</text>
    <text x="1245" y="866" class="small">Approve, reject, or re-survey</text>
  </g>
  <path d="M1040 705 C1110 745 1170 770 1210 800" class="green-arrow"/>
  <text x="1085" y="745" class="label">pending approval</text>

  <rect x="70" y="790" width="1010" height="95" rx="18" fill="#ffffff" stroke="#b8cbd8" stroke-width="2"/>
  <text x="100" y="827" class="box-title">Evidence and control boundary</text>
  <text x="100" y="856" class="body">S3 stores survey media and traces; DynamoDB stores status and work-order decisions;</text>
  <text x="100" y="878" class="body">the dashboard exposes evidence and keeps the final maintenance action human-gated.</text>
</svg>
