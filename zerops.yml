zerops:
  - setup: margai
    build:
      base: ubuntu@26.04
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y python3 python3-pip python3-venv libgl1 libglib2.0-0
      buildCommands:
        - cd /build/source && python3 -m pip install --break-system-packages --upgrade pip
        - cd /build/source && python3 -m pip install --break-system-packages --target vendor '.[api]'
      deployFiles:
        - marg
        - models
        - demo
        - vendor
      cache: []
    run:
      base: ubuntu@26.04
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y python3 python3-pip python3-venv libgl1 libglib2.0-0
      ports:
        - port: 8080
          httpSupport: true
      envVariables:
        PORT: "8080"
        MARG_DATA_ROOT: demo
        MARG_READ_ONLY: "1"
      start: PYTHONPATH=vendor python3 -m marg.entrypoint
      healthCheck:
        httpGet:
          port: 8080
          path: /api/health
