zerops:
  - setup: margai
    build:
      base: python@3.12
      prepareCommands:
        - sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      buildCommands:
        - python -m pip install --upgrade pip
        - python -m pip install '.[api]'
      deployFiles:
        - marg
        - models
        - demo
        - pyproject.toml
      cache: []
    run:
      base: python@3.12
      prepareCommands:
        - sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
        - python -m pip install '.[api]'
      ports:
        - port: 8080
          httpSupport: true
      envVariables:
        PORT: "8080"
        MARG_DATA_ROOT: demo
        MARG_READ_ONLY: "1"
      start: python -m marg.entrypoint
      healthCheck:
        httpGet:
          port: 8080
          path: /api/health
