AWSTemplateFormatVersion: "2010-09-09"
Description: MargAI low-cost road survey service

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ImageUri:
    Type: String
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-pro-v1:0
  AgentLlm:
    Type: String
    Default: mock
    AllowedValues: [mock, bedrock]
    Description: Use mock while Bedrock access is pending; select bedrock only after a successful provider check.
  ReadOnly:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Public demo mode. Writes require HTTPS, a dashboard domain, and an API token secret.
  CertificateArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:[^:]+:acm:[^:]+:[0-9]{12}:certificate/.+$'
    Description: Optional ACM certificate in this region for the dashboard domain.
  DashboardDomain:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-zA-Z0-9][a-zA-Z0-9.-]*\.[a-zA-Z]{2,}$'
    Description: DNS name covered by the certificate. Point it at the LoadBalancerDNS output.
  ApiTokenSecretArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Secrets Manager ARN containing the API token as a plaintext secret value; do not pass the token itself.
  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues:
      - ARM64
      - X86_64
  CreateEcrRepository:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

Conditions:
  ShouldCreateEcrRepository: !Equals [!Ref CreateEcrRepository, "true"]
  UseBedrock: !Equals [!Ref AgentLlm, bedrock]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasApiToken: !Not [!Equals [!Ref ApiTokenSecretArn, ""]]
  CanWrite: !And
    - !Equals [!Ref ReadOnly, "false"]
    - !Condition HasCertificate
    - !Condition HasApiToken

Rules:
  RequireHttpsDomain:
    RuleCondition: !Not [!Equals [!Ref CertificateArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref DashboardDomain, ""]]
        AssertDescription: A certificate needs a matching DashboardDomain with DNS pointing to the ALB.
  RequireSecureWrites:
    RuleCondition: !Equals [!Ref ReadOnly, "false"]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref CertificateArn, ""]]
          - !Not [!Equals [!Ref ApiTokenSecretArn, ""]]
        AssertDescription: Writes require CertificateArn and ApiTokenSecretArn.
  RequireSecureAuthentication:
    RuleCondition: !Not [!Equals [!Ref ApiTokenSecretArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, ""]]
        AssertDescription: API tokens must only be transmitted through HTTPS.

Resources:
  SurveyBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSurveyObjects
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SurveyBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SurveyBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SurveyBucket.Arn
              - !Sub "${SurveyBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  JobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDeadLetterQueue.Arn
        maxReceiveCount: 3

  WorkOrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: margai-work-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: survey_id
          AttributeType: S
        - AttributeName: work_order_id
          AttributeType: S
      KeySchema:
        - AttributeName: survey_id
          KeyType: HASH
        - AttributeName: work_order_id
          KeyType: RANGE

  SurveysTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: margai-surveys
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: survey_id
          AttributeType: S
      KeySchema:
        - AttributeName: survey_id
          KeyType: HASH

  EcrRepository:
    Type: AWS::ECR::Repository
    Condition: ShouldCreateEcrRepository
    Properties:
      RepositoryName: margai
      ImageScanningConfiguration:
        ScanOnPush: true

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: margai

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/margai
      RetentionInDays: 7

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies: !If
        - HasApiToken
        - - PolicyName: ReadApiToken
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref ApiTokenSecretArn
        - !Ref AWS::NoValue

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MargaiRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt SurveyBucket.Arn
                  - !Sub "${SurveyBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:SendMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt JobQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt WorkOrdersTable.Arn
                  - !GetAtt SurveysTable.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MargAI public ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MargAI Fargate task
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  HttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCertificate
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !If [HasCertificate, 443, 80]
      Protocol: !If [HasCertificate, HTTPS, HTTP]
      SslPolicy: !If [HasCertificate, ELBSecurityPolicy-TLS13-1-2-2021-06, !Ref AWS::NoValue]
      Certificates: !If
        - HasCertificate
        - - CertificateArn: !Ref CertificateArn
        - !Ref AWS::NoValue
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: margai
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: margai
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: MARG_READ_ONLY
              Value: !If [CanWrite, "0", "1"]
            - Name: MARG_COOKIE_SECURE
              Value: !If [HasCertificate, "1", "0"]
            - Name: MARG_AGENT_LLM
              Value: !Ref AgentLlm
            - Name: MARG_BEDROCK_ENABLED
              Value: !If [UseBedrock, "1", "0"]
            - Name: PORT
              Value: "8080"
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: MARG_S3_BUCKET
              Value: !Ref SurveyBucket
            - Name: MARG_SQS_QUEUE_URL
              Value: !Ref JobQueue
            - Name: MARG_WORK_ORDERS_TABLE
              Value: !Ref WorkOrdersTable
            - Name: MARG_SURVEYS_TABLE
              Value: !Ref SurveysTable
            - Name: MARG_BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
          Secrets: !If
            - HasApiToken
            - - Name: MARG_API_TOKEN
                ValueFrom: !Ref ApiTokenSecretArn
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: margai

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - Listener
    Properties:
      Cluster: !Ref Cluster
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: margai
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  DashboardURL:
    Description: Dashboard URL. HTTPS requires configuring your domain's DNS.
    Value: !If [HasCertificate, !Sub "https://${DashboardDomain}", !Sub "http://${LoadBalancer.DNSName}"]
  LoadBalancerDNS:
    Description: DNS alias or CNAME target for the dashboard domain.
    Value: !GetAtt LoadBalancer.DNSName
  ServiceName:
    Description: Physical ECS service name for operational commands.
    Value: !GetAtt Service.Name
  ClusterName:
    Description: ECS cluster name for operational commands.
    Value: !Ref Cluster
  Bucket:
    Value: !Ref SurveyBucket
  Queue:
    Value: !Ref JobQueue
  EcrRepository:
    Condition: ShouldCreateEcrRepository
    Value: !GetAtt EcrRepository.RepositoryUri
